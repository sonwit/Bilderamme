# Bygger nettsida fra repoets data og publiserer den på GitHub Pages.
# Krever at Pages er satt til «GitHub Actions» under Settings → Pages.
name: Nettside

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow bare til nedskalering av bildene. Sida bygges ellers med
      # standardbiblioteket.
      - run: pip install pillow
      - run: python3 nettside/bygg.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nettside/ut

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
